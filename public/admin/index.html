<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RIBAZ Admin Portal</title>

    <!-- Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>

  <body>
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- Logged in admin name/email badge -->
    <script>
      function showAdminUserBadge() {
        if (!window.netlifyIdentity) return;

        var user = window.netlifyIdentity.currentUser();
        if (!user) return;

        var oldBadge = document.getElementById("ribaz-admin-user-badge");
        if (oldBadge) {
          oldBadge.remove();
        }

        var metadata = user.user_metadata || {};

        var name =
          metadata.full_name ||
          metadata.name ||
          metadata.display_name ||
          user.email ||
          "Admin";

        var badge = document.createElement("div");
        badge.id = "ribaz-admin-user-badge";
        badge.textContent = name;

        badge.style.position = "fixed";
        badge.style.top = "58px";
        badge.style.right = "12px";
        badge.style.zIndex = "999999";
        badge.style.background = "#ffffff";
        badge.style.color = "#1f2937";
        badge.style.border = "1px solid #e5e7eb";
        badge.style.borderRadius = "999px";
        badge.style.padding = "7px 12px";
        badge.style.fontFamily = "Arial, sans-serif";
        badge.style.fontSize = "13px";
        badge.style.fontWeight = "600";
        badge.style.boxShadow = "0 6px 18px rgba(0,0,0,0.08)";
        badge.style.maxWidth = "calc(100vw - 24px)";
        badge.style.whiteSpace = "nowrap";
        badge.style.overflow = "hidden";
        badge.style.textOverflow = "ellipsis";

        document.body.appendChild(badge);
      }

      window.addEventListener("load", function () {
        setTimeout(showAdminUserBadge, 1500);
        setTimeout(showAdminUserBadge, 3000);
        setTimeout(showAdminUserBadge, 5000);

        if (window.netlifyIdentity) {
          window.netlifyIdentity.on("login", function () {
            setTimeout(showAdminUserBadge, 1000);
          });

          window.netlifyIdentity.on("logout", function () {
            var badge = document.getElementById("ribaz-admin-user-badge");
            if (badge) {
              badge.remove();
            }
          });
        }
      });
    </script>
  </body>
</html>
