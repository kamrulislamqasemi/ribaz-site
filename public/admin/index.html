<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RIBAZ Admin Portal</title>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
      #ribaz-admin-user-menu {
        position: fixed;
        top: 8px;
        right: 12px;
        z-index: 999999;
        font-family: Arial, sans-serif;
      }

      #ribaz-user-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #e5e7eb;
        background: #ffffff;
        color: #111827;
        border-radius: 999px;
        padding: 7px 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        max-width: 270px;
      }

      #ribaz-user-toggle span {
        display: block;
        max-width: 210px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #ribaz-user-avatar {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        background: #7c3f1d;
        color: white;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 800;
      }

      #ribaz-user-dropdown {
        display: none;
        position: absolute;
        top: 46px;
        right: 0;
        width: 280px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.16);
        overflow: hidden;
      }

      #ribaz-user-dropdown.show {
        display: block;
      }

      .ribaz-user-info {
        padding: 14px;
        border-bottom: 1px solid #f1f5f9;
      }

      .ribaz-user-name {
        font-size: 14px;
        font-weight: 800;
        color: #111827;
        margin-bottom: 4px;
      }

      .ribaz-user-email {
        font-size: 12px;
        color: #6b7280;
        word-break: break-all;
      }

      #ribaz-logout-btn {
        width: 100%;
        border: 0;
        background: #ffffff;
        color: #dc2626;
        padding: 13px 14px;
        text-align: left;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
      }

      #ribaz-logout-btn:hover {
        background: #fef2f2;
      }

      @media (max-width: 640px) {
        #ribaz-admin-user-menu {
          top: 7px;
          right: 8px;
        }

        #ribaz-user-toggle {
          padding: 6px 9px;
          max-width: 190px;
        }

        #ribaz-user-toggle span {
          max-width: 130px;
        }

        #ribaz-user-dropdown {
          width: 250px;
        }
      }
    </style>
  </head>

  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      function getUserDisplay(user) {
        var metadata = user.user_metadata || {};
        var name =
          metadata.full_name ||
          metadata.name ||
          metadata.display_name ||
          user.email ||
          "Admin";

        var email = user.email || "";
        var firstLetter = (name || email || "A").charAt(0).toUpperCase();

        return { name: name, email: email, firstLetter: firstLetter };
      }

      function createAdminUserMenu() {
        if (!window.netlifyIdentity) return;

        var user = window.netlifyIdentity.currentUser();
        if (!user) return;

        var oldMenu = document.getElementById("ribaz-admin-user-menu");
        if (oldMenu) oldMenu.remove();

        var data = getUserDisplay(user);

        var menu = document.createElement("div");
        menu.id = "ribaz-admin-user-menu";

        menu.innerHTML = `
          <button id="ribaz-user-toggle" type="button">
            <div id="ribaz-user-avatar">${data.firstLetter}</div>
            <span>${data.name}</span>
          </button>

          <div id="ribaz-user-dropdown">
            <div class="ribaz-user-info">
              <div class="ribaz-user-name">${data.name}</div>
              <div class="ribaz-user-email">${data.email}</div>
            </div>

            <button id="ribaz-logout-btn" type="button">
              Log out
            </button>
          </div>
        `;

        document.body.appendChild(menu);

        var toggle = document.getElementById("ribaz-user-toggle");
        var dropdown = document.getElementById("ribaz-user-dropdown");
        var logoutBtn = document.getElementById("ribaz-logout-btn");

        toggle.addEventListener("click", function (event) {
          event.stopPropagation();
          dropdown.classList.toggle("show");
        });

        logoutBtn.addEventListener("click", function () {
          window.netlifyIdentity.logout();
          setTimeout(function () {
            window.location.href = "/admin/";
          }, 300);
        });

        document.addEventListener("click", function () {
          dropdown.classList.remove("show");
        });
      }

      function moveQuickAddLeft() {
        var buttons = document.querySelectorAll("button");

        buttons.forEach(function (button) {
          var text = (button.textContent || "").trim().toLowerCase();

          if (text.includes("quick add")) {
            button.style.transform = "translateX(-42px)";
            button.style.position = "relative";
            button.style.zIndex = "999998";
          }
        });
      }

      function initRibazAdminTweaks() {
        createAdminUserMenu();
        moveQuickAddLeft();

        setTimeout(createAdminUserMenu, 1000);
        setTimeout(createAdminUserMenu, 2500);

        setTimeout(moveQuickAddLeft, 1000);
        setTimeout(moveQuickAddLeft, 2500);
        setTimeout(moveQuickAddLeft, 5000);
      }

      window.addEventListener("load", function () {
        initRibazAdminTweaks();

        if (window.netlifyIdentity) {
          window.netlifyIdentity.on("login", function () {
            setTimeout(initRibazAdminTweaks, 800);
          });

          window.netlifyIdentity.on("logout", function () {
            var menu = document.getElementById("ribaz-admin-user-menu");
            if (menu) menu.remove();
          });
        }
      });

      setInterval(moveQuickAddLeft, 3000);
    </script>
  </body>
</html>
