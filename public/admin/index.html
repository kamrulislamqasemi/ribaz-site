<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RIBAZ Admin Portal</title>

    <!-- Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
      /*
        RIBAZ admin small custom UI fixes
      */

      #ribaz-admin-user-box {
        position: fixed;
        top: 48px;
        right: 12px;
        z-index: 999999;
        width: 260px;
        max-width: calc(100vw - 24px);
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      #ribaz-admin-user-email {
        padding: 11px 13px;
        font-size: 13px;
        font-weight: 700;
        color: #111827;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-bottom: 1px solid #f1f5f9;
        background: #ffffff;
      }

      #ribaz-admin-logout-btn {
        width: 100%;
        border: 0;
        background: #7c2d12;
        color: #ffffff;
        padding: 11px 13px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
      }

      #ribaz-admin-logout-btn:hover {
        background: #9a3412;
      }

      /*
        Quick add button একটু বামে নিতে Decap CMS-এর top bar-এর প্রথম button target করা হচ্ছে।
        Decap CMS class name stable না, তাই text-based JS দিয়েও নিচে backup আছে।
      */
      .ribaz-quick-add-shift {
        transform: translateX(-10px) !important;
      }

      @media (max-width: 600px) {
        #ribaz-admin-user-box {
          top: 52px;
          right: 8px;
          width: 245px;
        }

        #ribaz-admin-user-email,
        #ribaz-admin-logout-btn {
          font-size: 12px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      function getCurrentAdminUser() {
        if (!window.netlifyIdentity) return null;
        return window.netlifyIdentity.currentUser();
      }

      function showAdminUserBox() {
        var user = getCurrentAdminUser();
        if (!user) return;

        var oldBox = document.getElementById("ribaz-admin-user-box");
        if (oldBox) {
          oldBox.remove();
        }

        var metadata = user.user_metadata || {};
        var email = user.email || metadata.email || "Admin";

        var box = document.createElement("div");
        box.id = "ribaz-admin-user-box";

        var emailDiv = document.createElement("div");
        emailDiv.id = "ribaz-admin-user-email";
        emailDiv.textContent = email;

        var logoutBtn = document.createElement("button");
        logoutBtn.id = "ribaz-admin-logout-btn";
        logoutBtn.type = "button";
        logoutBtn.textContent = "Log out";

        logoutBtn.addEventListener("click", function () {
          if (window.netlifyIdentity) {
            window.netlifyIdentity.logout();
          }

          var currentBox = document.getElementById("ribaz-admin-user-box");
          if (currentBox) currentBox.remove();

          setTimeout(function () {
            window.location.href = "/admin/";
          }, 500);
        });

        box.appendChild(emailDiv);
        box.appendChild(logoutBtn);
        document.body.appendChild(box);
      }

      function shiftQuickAddButton() {
        var buttons = Array.from(document.querySelectorAll("button"));

        buttons.forEach(function (button) {
          var text = (button.innerText || button.textContent || "").trim().toLowerCase();

          if (text.includes("quick add")) {
            button.classList.add("ribaz-quick-add-shift");
            button.style.marginLeft = "-10px";
          }
        });
      }

      function initRibazAdminFixes() {
        showAdminUserBox();
        shiftQuickAddButton();

        setTimeout(showAdminUserBox, 1000);
        setTimeout(showAdminUserBox, 2500);
        setTimeout(shiftQuickAddButton, 1000);
        setTimeout(shiftQuickAddButton, 2500);
      }

      window.addEventListener("load", function () {
        initRibazAdminFixes();

        if (window.netlifyIdentity) {
          window.netlifyIdentity.on("login", function () {
            setTimeout(initRibazAdminFixes, 800);
          });

          window.netlifyIdentity.on("logout", function () {
            var box = document.getElementById("ribaz-admin-user-box");
            if (box) box.remove();
          });
        }
      });

      setInterval(function () {
        shiftQuickAddButton();

        var user = getCurrentAdminUser();
        var box = document.getElementById("ribaz-admin-user-box");

        if (user && !box) {
          showAdminUserBox();
        }
      }, 3000);
    </script>
  </body>
</html>
